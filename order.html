<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__header">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
          <p>กรอกข้อมูลด้านล่าง ทีมงานจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <div class="form-wrap">
          <form id="orderForm">
            <div class="form-group">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="form-group">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="form-group">
              <label for="items">รายการสินค้า</label>
              <input type="text" id="items" name="items" required>
            </div>

            <div class="form-group">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="text" id="total" name="total" inputmode="numeric" required>
            </div>

            <div class="form-group">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <p>&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
